<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runic SSH</title>
  </head>
  <body>
    <!--
      A separate document, not a route inside the main one. ADR-0008 rests on
      this window never rendering a byte a remote host chose, and a separate
      entry point makes that a property of the build rather than a promise
      about which component is mounted: the terminal is not in this bundle.
      tests/credential-window.test.ts fails if it ever is.
    -->
    <div id="root"></div>
    <script type="module" src="/src/credential/main.tsx"></script>
  </body>
</html>
