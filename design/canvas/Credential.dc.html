<script data-dc-script data-props='{"accent":{"editor":"color","default":"#1ea7e2","options":["#1ea7e2","#986fdd","#2fb894","#e0a83c"],"section":"Theme"},"$preview":{"width":1040,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1ea7e2';
    const m = /^#([0-9a-f]{6})$/i.exec(accent.trim());
    const glow = m
      ? 'rgba(' + parseInt(m[1].slice(0, 2), 16) + ',' + parseInt(m[1].slice(2, 4), 16) + ',' + parseInt(m[1].slice(4, 6), 16) + ',0.18)'
      : 'rgba(30,167,226,0.18)';
    return { accent: accent, accentGlow: glow };
  }
}
