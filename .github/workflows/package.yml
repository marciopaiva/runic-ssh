# Installers for the three platforms.
#
# Same two rules as `gate.yml`: only GitHub-owned actions, each pinned to a
# commit rather than a tag, because section 4 of docs/security-model.md names a
# supply chain attacker as an adversary and a tag can be moved.
#
# Run by hand from the Actions tab, and on a version tag. Building on every push
# would spend twenty minutes of runner time to produce an artifact nobody asked
# for; issue #40 is about installers somebody is going to install.
#
# A tag also publishes a GitHub Release. That is the only mechanism here that
# hands a binary to someone who is not signed in, so it is the one job that
# holds `contents: write`, and it holds it alone.
#
# **These builds are unsigned.** See docs/installing.md — an unsigned installer
# is a real thing a user has to work around, and pretending otherwise in a
# release note is how people learn to click through security warnings.

name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  package:
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports. A Windows installer is still worth having when
      # the macOS build breaks.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            bundles: deb,rpm,appimage
          - os: windows-latest
            artifact: windows
            bundles: msi,nsis
          - os: macos-latest
            artifact: macos
            bundles: dmg,app

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep this list in step with gate.yml and docs/installing.md: a
      # contributor who cannot build locally will look at one of the three.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            patchelf \
            rpm

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: package-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: package-${{ runner.os }}-

      # The gate runs on every pull request, but a tag can point anywhere. An
      # installer built from code that does not pass its own tests is worse
      # than no installer, because somebody will install it.
      - name: Run the gate
        run: |
          pnpm typecheck
          pnpm test
        shell: bash

      # The cache above restores `src-tauri/target`, and `target/release/bundle`
      # is inside it, so a hit brings the previous run's installers back with
      # the object files. The collect step below takes whatever it finds there,
      # which is how v0.2.0 was published carrying four 0.1.1 installers beside
      # its own. Nothing in the build removes them: a bundler writes the file
      # for the version it is building and leaves every other one alone.
      #
      # It stayed hidden until v0.2.0 because a cache is scoped to the ref that
      # wrote it, plus the default branch, so one tag cannot read another tag's.
      # The first `workflow_dispatch` on main, run to get a Windows installer at
      # 0.1.1, is what put a cache where the next tag could reach it.
      - name: Clear any installer an earlier run left behind
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      # The quotes are load-bearing. On Windows this step runs under pwsh,
      # where a bare `msi,nsis` is an *array literal* — PowerShell splits it and
      # hands the CLI a single argument reading "msi nsis", which it rejects.
      # Quoting keeps it one string, and clap splits it on the comma itself.
      - name: Build the installers
        run: pnpm tauri build --bundles "${{ matrix.bundles }}"

      # productName carries a space, so every artifact does too. Renaming here
      # rather than renaming the product: a file called "Runic SSH_0.1.0.msi"
      # breaks naive download commands and reads as an accident.
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -print0 |
            while IFS= read -r -d '' file; do
              cp "$file" "artifacts/$(basename "$file" | tr ' ' '-')"
            done

          # Belt as well as braces. Clearing the bundle directory is what stops
          # a stale installer being collected; this is what makes it loud if
          # anything else ever puts one there. A release carrying two versions
          # of the same installer is the failure being guarded against, and
          # nothing else in this file would notice it.
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for file in artifacts/*; do
            case "$(basename "$file")" in
              *"$version"*) ;;
              *) echo "::error::$file is not version $version"; exit 1 ;;
            esac
          done

          # The instruction in docs/installing.md is to compare a download
          # against the run that produced it. That is only executable if the run
          # publishes the hashes, so it does.
          ( cd artifacts && sha256sum * > SHA256SUMS )
          ls -lh artifacts
          cat artifacts/SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runic-ssh-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  # Building an installer is not installing it, and nothing in this file used to
  # tell the two apart. Three green build jobs published v0.2.0 carrying four
  # installers from the previous version (#182), and a package that installs
  # nothing, or installs and opens a blank window, would have gone out the same
  # way. This job installs what the build produced, on the platform it is for,
  # and `release` waits for it: a tag with a broken installer now creates no
  # page at all, rather than one somebody has to clean up afterwards.
  #
  # It is deliberately not the whole of docs/testing.md. Connecting to a host
  # needs a credential typed into a window and an `sshd` whose login grace
  # period is running while a runner is busy, which is a test that fails for the
  # wrong reason on the one day nobody wants to argue with it. #184 is where
  # that is written down.
  smoke:
    name: smoke / ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download this platform's installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runic-ssh-${{ matrix.artifact }}
          path: installers

      - name: Read the version being built
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      # The `.deb` is the package a Linux user actually installs, and `apt`
      # resolving its dependencies is half of what is being checked: the webview
      # is the system's, so a wrong or missing `libwebkit2gtk` dependency is an
      # application that installs and cannot start.
      - name: Install the deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb=$(ls installers/*.deb)
          sudo apt-get update -qq
          sudo apt-get install -y -qq "./$deb"

          installed=$(dpkg-query -W -f='${Version}' runic-ssh)
          if [ "$installed" != "$version" ]; then
            echo "::error::dpkg reports $installed, the build says $version"
            exit 1
          fi
          test -x /usr/bin/runic-ssh

      # A window that maps proves the entry point resolves. It does not prove
      # the frontend is in the package, because a webview with nothing to render
      # maps a window all the same. That is the failure `tauri dev` can never
      # reproduce, since it serves the frontend from Vite, so the check is on
      # the pixels.
      #
      # What is measured is the share of the image taken by its most common
      # shade. A rendered window is a rail, a list, a strip and a body, and no
      # one shade owns it; a webview showing nothing, or showing WebKit's own
      # "not found" page, is one colour with a few glyphs on it. Measured, on
      # this application's emptiest screen and on a mock of that error page:
      #
      #   0.72  the empty state, from an installed package
      #   0.999 a white page carrying one line of error text
      #   1.00  a flat fill
      #
      # Standard deviation was tried first and is not the right instrument: the
      # error page scores 0.022 against the real window's 0.034, because a
      # handful of black glyphs on white is a large deviation from a mean of
      # almost one. It separates a *blank* window from a real one and calls an
      # error page healthy, which is the case worth catching.
      - name: Open it on a virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -qq xvfb openbox x11-utils xdotool imagemagick

          export DISPLAY=:99
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          # Every one of these has to be killed, and their output has to go to a
          # file. A background process holding the step's stdout keeps the pipe
          # open after the script exits, and the job then sits there until the
          # workflow times out, which is a six hour way of saying "passed".
          started=
          trap 'kill $started 2>/dev/null || true' EXIT

          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          started="$started $!"
          sleep 2
          openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          started="$started $!"
          sleep 1

          # WebKit needs somewhere to keep a runtime socket or it never maps a
          # window at all, and every capture comes back black. The window
          # manager is what gives the window keyboard focus; without one the
          # window still maps, so this is belt for a later test rather than
          # this one.
          WEBKIT_DISABLE_COMPOSITING_MODE=1 /usr/bin/runic-ssh > "$RUNNER_TEMP/app.log" 2>&1 &
          app=$!
          started="$started $app"

          window=
          for _ in $(seq 1 40); do
            for candidate in $(xdotool search --name '^Runic SSH$' 2>/dev/null); do
              width=$(xwininfo -id "$candidate" | awk '/Width:/{print $2}')
              if [ "${width:-0}" -gt 800 ]; then window=$candidate; break 2; fi
            done
            sleep 1
          done

          if [ -z "$window" ]; then
            echo "::error::no window of the application's size ever mapped"
            cat "$RUNNER_TEMP/app.log" || true
            exit 1
          fi

          sleep 4
          import -window "$window" window.png

          total=$(convert window.png -format '%[fx:w*h]' info:)
          share=$(convert window.png -colorspace Gray -depth 8 -format %c histogram:info:- |
            awk -v total="$total" '
              { gsub(/^ +/, ""); n = $1 + 0; if (n > max) max = n }
              END { printf "%.4f", max / total }')
          echo "window $window, most common shade covers $share of it"

          if ! awk -v s="$share" 'BEGIN { exit !(s < 0.95) }'; then
            echo "::error::the window mapped and rendered nothing: one shade covers $share of it"
            exit 1
          fi

      # Kept whether or not the step passed. A blank capture is the evidence for
      # the failure it reports, and describing it in a log line instead would
      # throw away the only thing worth looking at.
      - name: Keep the capture
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-window
          path: window.png
          if-no-files-found: warn

      # `/S` is a silent per-user install into `%LOCALAPPDATA%`, so it needs no
      # elevation and a runner can drive it. The `.msi` is per-machine and wants
      # a UAC prompt nobody is there to answer, which is why it is built here
      # and installed nowhere.
      - name: Install the NSIS package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers\*-setup.exe | Select-Object -First 1
          $result = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            Write-Output "::error::the installer exited $($result.ExitCode)"
            exit 1
          }

          # Found rather than assumed: the layout under %LOCALAPPDATA% is the
          # bundler's to choose, and hard-coding it here would turn a rename
          # into a failure that reads like a broken install.
          $found = @(Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter 'runic-ssh.exe' -ErrorAction SilentlyContinue)
          if ($found.Count -ne 1) {
            Write-Output "::error::expected one installed runic-ssh.exe, found $($found.Count)"
            exit 1
          }

          $installed = $found[0].VersionInfo.FileVersion
          Write-Output "installed $($found[0].FullName) reporting $installed"
          if (-not $installed.StartsWith($env:version)) {
            Write-Output "::error::the installed binary reports $installed, the build says $env:version"
            exit 1
          }

      # macOS is mounted and read rather than opened. The runner could open it,
      # but nobody has ever opened this application on a Mac and a green job
      # here would read as if somebody had. What this proves is narrower and
      # true: the disk image mounts, and the bundle inside it is this version.
      - name: Mount the dmg and read the bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls installers/*.dmg)
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint /Volumes/runic

          app=$(ls -d /Volumes/runic/*.app)
          plist="$app/Contents/Info.plist"
          installed=$(plutil -extract CFBundleShortVersionString raw "$plist")
          echo "$app reports $installed"

          hdiutil detach /Volumes/runic

          if [ "$installed" != "$version" ]; then
            echo "::error::the bundle reports $installed, the build says $version"
            exit 1
          fi

  # Only on a tag. A `workflow_dispatch` build stays behind the Actions tab,
  # where reaching it takes an account and a deliberate click — which is the
  # right amount of friction for an unsigned binary nobody has installed yet.
  release:
    name: release
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # The only elevated permission in this file, on the only job that needs it.
    # The three build jobs stay at the workflow-level `contents: read`, so a
    # compromised build step cannot publish.
    permissions:
      contents: write

    steps:
      - name: Collect every platform's artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # Each platform wrote its own SHA256SUMS beside its own installers. They
      # concatenate into one file for the release, and then it is *checked* —
      # a hash that only ever gets written proves nothing about the bytes a
      # person downloads, and this is the step where they moved.
      - name: Assemble and verify
        run: |
          mkdir -p release
          find artifacts -type f ! -name SHA256SUMS -exec cp {} release/ \;
          cat artifacts/*/SHA256SUMS > release/SHA256SUMS
          ( cd release && sha256sum -c SHA256SUMS )
          ls -lh release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Short on purpose, and a pointer rather than a second copy. Which
          # platforms have actually been installed changes between releases,
          # and docs/installing.md is where that is tracked; duplicating it
          # here would create a version of the truth that ages in private.
          notes=$(cat <<'EOF'
          **These installers are not code-signed.** Windows will show SmartScreen
          and macOS will call the app damaged. Neither is a malfunction and both
          are described, with the exact commands, in
          [`docs/installing.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/installing.md).

          That page also carries the table of **which platforms anyone has
          actually installed**, as opposed to which ones the build produced.
          Read it before assuming a package has been run by a human.

          [`CHANGELOG.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
          has what this release adds and — the part worth reading — what it
          still does not do.

          `SHA256SUMS` covers every file attached here, and the hashes were
          checked against the bytes after they left the build machines:

          ```sh
          sha256sum -c SHA256SUMS --ignore-missing
          ```
          EOF
          )
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "$notes" \
            --prerelease \
            --verify-tag
