# Checks the dependency tree against the RustSec advisory database.
#
# ADR-0003 accepted ownership of the SSH layer's security response when it chose
# `russh` over the system OpenSSH binary: nobody patches this for us. That
# decision is only honest if an advisory reaches us without someone remembering
# to look, which is what the schedule below is for.
#
# Advisories are platform-independent, so this runs on Linux alone rather than
# repeating an identical answer three times.

name: audit

on:
  # Deliberately unfiltered. A `paths` filter here would be cheaper, but a
  # required check that is skipped never reports, and a pull request waiting on
  # a report that will not come can never merge. Roughly a minute per run with
  # the binary cached is the price of this check being enforceable at all.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # A new advisory can land on a dependency nobody touched. Without this, the
  # tree is only checked when someone happens to open a pull request.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Superseding a run is a saving on a branch and a loss on `main`. A push to the
# default branch always finishes: the badge reads the newest run, so a cancelled
# one shows the workflow as failing until something replaces it — and, worse, a
# commit whose run was killed can never answer "did this pass on main". Two
# merges seven seconds apart is all it takes.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2

jobs:
  audit:
    name: audit / advisories
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      # cargo-audit takes about a minute to compile, and the binary only changes
      # when the pinned version does.
      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version ${{ env.CARGO_AUDIT_VERSION }}

      # --deny warnings is what gives this teeth. Advisories we have reviewed and
      # cannot act on are listed in src-tauri/.cargo/audit.toml; anything else,
      # warning or vulnerability, fails here.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit --deny warnings

  deny:
    name: deny / licences, bans, sources
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      # cargo-deny takes a couple of minutes to compile, and the binary only
      # changes when the pinned version does.
      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version ${{ env.CARGO_DENY_VERSION }}

      # Advisories are `cargo audit`'s job, above; this checks the three things
      # it doesn't. `deny.toml` explains the allow lists and the one crate that
      # needs an exception.
      - name: cargo deny
        working-directory: src-tauri
        run: cargo deny check bans licenses sources

  pnpm-audit:
    name: audit / npm advisories
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # pnpm comes from the packageManager field in package.json, so CI runs
      # the exact version the lockfile was written with.
      - name: Enable pnpm
        run: corepack enable

      # `pnpm-lock.yaml` is committed and `--frozen-lockfile` is enforced
      # everywhere else, so nothing on this tree moves without a commit. What
      # was missing, #92, was any check of what's pinned against a known
      # vulnerability. This is the smallest thing that closes that gap: the
      # same workflow the Rust side already uses, the pnpm equivalent of
      # `cargo audit` above. Version drift with no advisory attached is a
      # separate question, deliberately left open by #92, since a tree this
      # small (6 runtime, 10 dev dependencies) doesn't yet justify a bot
      # opening one pull request per outdated package.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Fails on any advisory at low severity or above. There is no allow
      # list file the way `cargo audit` has one in `src-tauri/.cargo/`: pnpm
      # has no such config, only a per-run `--ignore <GHSA-id>` flag. If an
      # unfixable advisory is ever found here and reviewed as not reachable,
      # add that flag to the command below with a comment naming the
      # advisory and the reason, the same way `audit.toml` explains each of
      # its entries.
      - name: pnpm audit
        run: pnpm audit --audit-level=low
