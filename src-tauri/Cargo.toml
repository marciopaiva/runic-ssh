[package]
name = "runic-ssh"
version = "0.1.1"
description = "A modern, fast, and secure cross-platform SSH/SFTP client"
authors = ["Marcio Paiva Barbosa"]
license = "MIT"
repository = "https://github.com/marciopaiva/runic-ssh"
edition = "2021"

# The library carries everything; the binary is a launcher. Keeping `run` in the
# library is what lets integration tests reach the core without the binary.
[lib]
name = "runic_ssh"
path = "src/lib.rs"

[[bin]]
name = "runic-ssh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Dependencies arrive with the issue that needs them, not in advance. `russh`,
# `russh-sftp`, `keyring` and `zeroize` are recorded stack decisions with no
# caller yet.
[dependencies]
# Primitives for known_hosts: SHA-256 for fingerprints, HMAC-SHA-1 for hashed
# host names, base64 for the key blob. All four already arrive with `russh`
# (ADR-0003), so declaring them here does not enlarge the final graph.
# See adr/0009-parse-known-hosts-ourselves.md.
base64ct = { version = "1.8.3", features = ["alloc"] }
hmac = "0.13.0"
keyring = "4.1.6"
# RSA stays enabled so we can verify an RSA host key, which is a public-key
# operation and is not what RUSTSEC-2023-0071 attacks. Signing with an RSA
# private key is refused in ssh::connection instead.
# See adr/0010-refuse-rsa-private-keys.md.
russh = "0.63.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.0"
tauri = { version = "2", features = [] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "rt", "time"] }
zeroize = "1.9.0"

[dev-dependencies]
rand = "0.10.2"
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
